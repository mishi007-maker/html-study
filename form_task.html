<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Application Form</h1><br>
    <form action="">
        <label for="">Full Name:</label>
        <input type="text" name="Full Name">
        <label for="">Last Name:</label>
        <input type="text" name="Last Name"><br><br>
        <label for="">Date of Birth:</label>
        <input type="Date" placeholder="" name="Date of Birth">
        <label for="">Age:</label>
        <input type="number" name="Age" min="18" max="50"><br><br>
        <label for="Gender">Gender:</label>
        <select name="Gender" id="Gender">
            <option value="Male" selected>Male</option>
            <option value="Female" selected>Female</option>
        </select>
        <label for="">Email Address:</label>
        <input type="text" placeholder="Enter email address"><br><br>
        <label for="">Positions available:</label>
        <input type="radio" name="Positions available">Junior Developer
        <input type="radio" name="Positions available">Mid-level Developer
        <input type="radio" name="Positions available">Senior Developer <br><br>
        <label for="">Programming Languages:</label>
        <input type="checkbox" name="Programming Languages">Java
        <input type="checkbox" name="Programming Languages">Java Script
        <input type="checkbox" name="Programming Languages">Python <br><br>
        <label for="">Password:</label>
        <input type="password">
        <label for="">Confirm Password:</label>
        <input type="password"><br><br>
        <input type="submit">
        <input type="submit" value="Reset">
</body>

</html>
